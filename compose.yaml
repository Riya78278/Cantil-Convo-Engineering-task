services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: corvo
      POSTGRES_USER: corvo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - corvo_database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U corvo -d corvo"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PGHOST: db
      PGDATABASE: corvo
      PGUSER: corvo
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORVO_SECURE_COOKIES: "0"
    depends_on:
      db:
        condition: service_healthy
volumes:
  corvo_database:
